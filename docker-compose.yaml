services:
  rabbitmq:
    image: rabbitmq:4.3.3-management-alpine
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - file-converter-network

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  file-converter-network:
    driver: bridge
